<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central de Chamados</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f6cbd'/%3E%3Cpath d='M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 6v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-6V7Z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M14 5v14' stroke='white' stroke-width='1.6' stroke-dasharray='2.2 2.2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="app-header-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 6v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-6V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M14 5v14" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 2.2"/>
          </svg>
        </div>
        <div>
          <h1>Central de Chamados</h1>
          <p class="subtitulo">Abra um chamado e acompanhe a triagem automática por AI</p>
        </div>
      </header>

      <div class="stack-pills" aria-label="Stack usada">
        <span class="pill">S3</span>
        <span class="pill">API Gateway</span>
        <span class="pill">Lambda</span>
        <span class="pill">DynamoDB</span>
        <span class="pill">SQS</span>
        <span class="pill">SNS</span>
        <span class="pill">Strands + Groq</span>
      </div>

      <section class="card">
        <h2>Acesso</h2>
        <div class="field">
          <label class="field-label" for="api-key">Chave de acesso</label>
          <div class="field-control">
            <input
              type="password"
              id="api-key"
              placeholder="Cole a ApiKey aqui"
              autocomplete="off"
              spellcheck="false"
              aria-describedby="api-key-hint"
            />
            <button type="button" class="input-action" id="btn-revelar" aria-label="Mostrar chave" aria-pressed="false">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="2.75" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
          <span class="field-hint" id="api-key-hint">
            Impressa no fim do <code>deploy-frontend.sh</code>. Fica só nesta aba do navegador —
            nunca é embutida no site.
          </span>
        </div>
      </section>

      <section class="card">
        <h2>Novo chamado</h2>
        <form id="form-chamado">
          <div class="field">
            <label class="field-label" for="titulo">Título</label>
            <div class="field-control">
              <input type="text" id="titulo" required placeholder="Servidor fora do ar" autocomplete="off" />
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="descricao">Descrição</label>
            <div class="field-control">
              <textarea id="descricao" rows="3" placeholder="Detalhe o problema..."></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Abrir chamado
          </button>
        </form>
        <p id="status-form" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="card">
        <div class="lista-header">
          <h2>Chamados</h2>
          <button id="btn-atualizar" type="button" class="btn btn-subtle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 4v5h5M20 20v-5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4.5 15a8 8 0 0 0 14.4 2.5M19.5 9A8 8 0 0 0 5.1 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            Atualizar
          </button>
        </div>
        <ul id="lista-chamados"></ul>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
