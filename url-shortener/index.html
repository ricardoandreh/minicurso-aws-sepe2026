<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encurtador de URL</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232d843b'/%3E%3Cpath d='M10 14a4 4 0 0 0 5.66 0l2-2A4 4 0 0 0 12 6.34l-1 1M14 10a4 4 0 0 0-5.66 0l-2 2A4 4 0 0 0 12 17.66l1-1' fill='none' stroke='white' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Tokens do Microsoft Fluent 2 (nomes conforme @fluentui/react-components) */
:root {
  color-scheme: light dark;
  --colorNeutralBackground1: #ffffff;
  --colorNeutralBackground3: #f5f5f5;
  --colorSubtleBackgroundHover: #f5f5f5;
  --colorNeutralForeground1: #242424;
  --colorNeutralForeground2: #424242;
  --colorNeutralForeground3: #616161;
  --colorNeutralForeground4: #707070;
  --colorNeutralForegroundDisabled: #bdbdbd;
  --colorNeutralBackgroundDisabled: #f0f0f0;
  --colorNeutralStroke1: #d1d1d1;
  --colorNeutralStroke2: #e0e0e0;
  --colorNeutralStrokeAccessible: #616161;
  /* Marca: paleta do Instituto Federal Catarinense.
     O verde institucional puro (#3cb04f) tem só 2,79:1 com texto branco e
     reprova no AA da WCAG, que pede 4,5:1. Os tons de preenchimento abaixo são
     esse mesmo verde escurecido até passar, mantendo a matiz. Os tons claros
     (#e3f7e3) e o vermelho (#ca2027) vêm direto da paleta oficial. */
  --ifcVerde: #3cb04f;              /* verde institucional, referência */
  --ifcVermelho: #ca2027;           /* vermelho institucional */
  --colorBrandBackground: #2d843b;        /* 4,69:1 com branco */
  --colorBrandBackgroundHover: #2a7b37;   /* 5,27:1 */
  --colorBrandBackgroundPressed: #246a2f; /* 6,61:1 */
  --colorBrandBackground2: #e3f7e3;       /* tom claro da paleta oficial */
  --colorBrandForeground1: #277233;       /* 5,93:1 sobre branco */
  --colorBrandStroke1: #2d843b;
  --colorPaletteRedForeground1: #b61d23;  /* vermelho IFC escurecido, 6,59:1 */
  --colorPaletteRedBackground1: #fdf2f3;
  --colorPaletteGreenForeground1: #246a2f;
  --colorStrokeFocus2: #000000;
  --shadow2: 0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
  --borderRadiusMedium: 4px;
  --borderRadiusXLarge: 8px;
  --durationFaster: 100ms;
  --durationNormal: 200ms;
  --curveDecelerateMid: cubic-bezier(.1,.9,.2,1);
  --fontFamilyBase: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI",
    -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --fontFamilyMonospace: "Cascadia Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --colorNeutralBackground1: #292929;
    --colorNeutralBackground3: #141414;
    --colorSubtleBackgroundHover: #383838;
    --colorNeutralForeground1: #ffffff;
    --colorNeutralForeground2: #d6d6d6;
    --colorNeutralForeground3: #adadad;
    --colorNeutralForeground4: #999999;
    --colorNeutralForegroundDisabled: #5c5c5c;
    --colorNeutralBackgroundDisabled: #1f1f1f;
    --colorNeutralStroke1: #666666;
    --colorNeutralStroke2: #525252;
    --colorNeutralStrokeAccessible: #adadad;
    --colorBrandBackground: #2d843b;
    --colorBrandBackgroundHover: #308d3f;
    --colorBrandBackgroundPressed: #246a2f;
    --colorBrandBackground2: #16331a;
    --colorBrandForeground1: #63c072;       /* 6,45:1 sobre #292929 */
    --colorBrandStroke1: #63c072;
    --colorPaletteRedForeground1: #ee7a7f;
    --colorPaletteRedBackground1: #3b1113;
    --colorPaletteGreenForeground1: #63c072;
    --colorStrokeFocus2: #ffffff;
    --shadow2: 0 1px 2px rgba(0,0,0,.28), 0 0 2px rgba(0,0,0,.24);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: var(--colorNeutralBackground3);
  color: var(--colorNeutralForeground1);
  font-family: var(--fontFamilyBase);
  font-size: 14px;
  line-height: 20px;
  -webkit-font-smoothing: antialiased;
}
:where(button, input):focus-visible {
  outline: 2px solid var(--colorStrokeFocus2);
  outline-offset: 1px;
}

/* Faixa do vermelho ao verde, o elemento gráfico da identidade do IFC.
   Fica no topo do card em vez de ocupar a página inteira: dá a assinatura
   visual sem competir com o conteúdo. */
.card::before {
  content: "";
  display: block;
  height: 4px;
  margin: -24px -24px 20px;
  border-radius: var(--borderRadiusXLarge) var(--borderRadiusXLarge) 0 0;
  background: linear-gradient(
    90deg,
    var(--ifcVermelho) 0 22%,
    #349a46 22%, #3cb04f 34%, #62ca71 48%,
    #8eda96 62%, #c2ecc4 78%, #e9f9e9 92%, #f8fef8 100%
  );
}

.card {
  width: 100%;
  max-width: 460px;
  padding: 24px;
  overflow: hidden;
  background: var(--colorNeutralBackground1);
  border: 1px solid var(--colorNeutralStroke2);
  border-radius: var(--borderRadiusXLarge);
  box-shadow: var(--shadow2);
}
.header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.header-icon {
  display: flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; flex-shrink: 0;
  border-radius: var(--borderRadiusXLarge);
  background: var(--colorBrandBackground2);
  color: var(--colorBrandForeground1);
}
h1 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; }
.sub { margin: 0; font-size: 12px; line-height: 16px; color: var(--colorNeutralForeground3); }

.field { display: flex; flex-direction: column; gap: 4px; }
.label { font-size: 14px; font-weight: 600; }

/* Input do Fluent 2: borda inferior mais escura em repouso, e no foco um
   traço de 2px na cor da marca que cresce a partir do centro. */
.control {
  position: relative; display: flex; align-items: center;
  padding: 0 8px; height: 32px;
  background: var(--colorNeutralBackground1);
  border: 1px solid var(--colorNeutralStroke1);
  border-bottom-color: var(--colorNeutralStrokeAccessible);
  border-radius: var(--borderRadiusMedium);
}
.control::after {
  content: ""; position: absolute; left: -1px; right: -1px; bottom: -1px;
  height: 2px; background: var(--colorBrandStroke1);
  border-bottom-left-radius: var(--borderRadiusMedium);
  border-bottom-right-radius: var(--borderRadiusMedium);
  transform: scaleX(0);
  transition: transform var(--durationNormal) var(--curveDecelerateMid);
}
.control:focus-within::after { transform: scaleX(1); }
.control input {
  flex: 1; min-width: 0; padding: 0;
  font: inherit; color: inherit; background: none; border: none; outline: none;
}
.control input::placeholder { color: var(--colorNeutralForeground4); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 32px; padding: 0 12px;
  font: inherit; font-weight: 600;
  border: 1px solid transparent; border-radius: var(--borderRadiusMedium);
  cursor: pointer;
  transition: background-color var(--durationFaster) ease;
}
.btn:disabled {
  cursor: not-allowed;
  background: var(--colorNeutralBackgroundDisabled);
  color: var(--colorNeutralForegroundDisabled);
}
.btn-primary {
  width: 100%; margin-top: 16px;
  background: var(--colorBrandBackground); color: #fff;
}
.btn-primary:hover:not(:disabled) { background: var(--colorBrandBackgroundHover); }
.btn-primary:active:not(:disabled) { background: var(--colorBrandBackgroundPressed); }
.btn-subtle {
  background: none; color: var(--colorNeutralForeground2);
  border-color: var(--colorNeutralStroke1);
}
.btn-subtle:hover:not(:disabled) { background: var(--colorSubtleBackgroundHover); }

.msg {
  margin-top: 16px; padding: 8px 12px;
  border: 1px solid var(--colorPaletteRedForeground1);
  background: var(--colorPaletteRedBackground1);
  border-radius: var(--borderRadiusMedium);
}
.msg[hidden] { display: none; }
.msg-dica { margin: 4px 0 0; font-size: 12px; color: var(--colorNeutralForeground2); }

.lista-header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 24px 0 12px; padding-top: 20px;
  border-top: 1px solid var(--colorNeutralStroke2);
}
.lista-header h2 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

.item {
  padding: 12px;
  border: 1px solid var(--colorNeutralStroke2);
  border-radius: var(--borderRadiusMedium);
  transition: border-color var(--durationFaster) ease;
}
.item:hover { border-color: var(--colorNeutralStroke1); }
.item-topo { display: flex; align-items: center; gap: 8px; }
.item-link {
  flex: 1; min-width: 0;
  font-family: var(--fontFamilyMonospace); font-size: 14px; font-weight: 600;
  color: var(--colorBrandForeground1); text-decoration: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item-link:hover { text-decoration: underline; }
.item-url {
  margin: 4px 0 0; font-size: 12px; line-height: 16px;
  color: var(--colorNeutralForeground3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Badge do Fluent 2 (appearance="tint") */
.badge {
  flex-shrink: 0; min-width: 28px; text-align: center;
  padding: 2px 8px; font-size: 12px; line-height: 16px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  border-radius: 10000px;
  background: var(--colorBrandBackground2); color: var(--colorBrandForeground1);
}
.btn-mini {
  flex-shrink: 0; height: 24px; padding: 0 8px; font-size: 12px;
  background: none; color: var(--colorNeutralForeground2);
  border: 1px solid var(--colorNeutralStroke1); border-radius: var(--borderRadiusMedium);
  font-family: inherit; font-weight: 600; cursor: pointer;
}
.btn-mini:hover { background: var(--colorSubtleBackgroundHover); }
.vazio {
  padding: 24px 0; text-align: center;
  color: var(--colorNeutralForeground3); font-size: 14px;
}
.ok { color: var(--colorPaletteGreenForeground1); }
</style>
</head>
<body>
<main class="card">
  <header class="header">
    <div class="header-icon" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M10 14a4 4 0 0 0 5.66 0l3-3A4 4 0 0 0 13 5.34l-1.5 1.5M14 10a4 4 0 0 0-5.66 0l-3 3A4 4 0 0 0 11 18.66l1.5-1.5"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <h1>Encurtador de URL</h1>
      <p class="sub">S3 · API Gateway · Lambda · DynamoDB · SQS</p>
    </div>
  </header>

  <form id="form">
    <div class="field">
      <label class="label" for="url">URL longa</label>
      <div class="control">
        <input type="url" id="url" required spellcheck="false"
               placeholder="https://exemplo.com/uma-pagina-bem-longa">
      </div>
    </div>
    <button type="submit" class="btn btn-primary" id="btn-encurtar">Encurtar</button>
  </form>

  <div class="msg" id="erro" role="alert" hidden>
    <span id="erro-texto"></span>
    <p class="msg-dica" id="erro-dica" hidden></p>
  </div>

  <div class="lista-header">
    <h2>Links cadastrados</h2>
    <button type="button" class="btn btn-subtle" id="btn-atualizar">Atualizar</button>
  </div>
  <ul id="lista"></ul>
</main>

<script>
// ─────────────────────────────────────────────────────────────
// Cole aqui a Invoke URL da sua HTTP API, sem barra no final.
const API_URL = "https://61m67seo17.execute-api.us-east-1.amazonaws.com";
// ─────────────────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);

function erro(texto, dica) {
  $("erro-texto").textContent = texto;
  $("erro-dica").textContent = dica || "";
  $("erro-dica").hidden = !dica;
  $("erro").hidden = false;
}
const limparErro = () => ($("erro").hidden = true);

// `fetch` falha com TypeError tanto por rede quanto por CORS bloqueado —
// e CORS é de longe o motivo mais provável aqui.
function mensagemDeFalha(e) {
  if (e instanceof TypeError) {
    return ["Não foi possível falar com a API.",
            "Confira o API_URL no index.html e se o CORS está configurado na HTTP API."];
  }
  return [e.message, null];
}

async function pedir(caminho, opcoes) {
  const resposta = await fetch(`${API_URL}${caminho}`, opcoes);
  if (!resposta.ok) throw new Error(`A API respondeu HTTP ${resposta.status}`);
  return resposta.json();
}

async function copiar(texto, botao) {
  try {
    // navigator.clipboard só existe em origem segura, e o site hospedado no
    // S3 website hosting é HTTP puro — daí o fallback.
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(texto);
    } else {
      const campo = document.createElement("textarea");
      campo.value = texto;
      campo.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(campo);
      campo.select();
      document.execCommand("copy");
      campo.remove();
    }
    const antes = botao.textContent;
    botao.textContent = "Copiado";
    setTimeout(() => (botao.textContent = antes), 1500);
  } catch {
    erro("Não foi possível copiar.", "Selecione o texto e copie manualmente.");
  }
}

function criarItem(link) {
  const url = `${API_URL}/${link.shortId}`;

  const item = document.createElement("li");
  item.className = "item";

  const topo = document.createElement("div");
  topo.className = "item-topo";

  // Abre em outra aba de propósito: clicar aqui passa pelo redirect e gera
  // um clique de verdade — é assim que se demonstra o contador subindo.
  const ancora = document.createElement("a");
  ancora.className = "item-link";
  ancora.href = url;
  ancora.target = "_blank";
  ancora.rel = "noopener";
  ancora.textContent = link.shortId;

  const cliques = document.createElement("span");
  cliques.className = "badge";
  cliques.title = "cliques";
  cliques.textContent = link.clicks;

  const botao = document.createElement("button");
  botao.type = "button";
  botao.className = "btn-mini";
  botao.textContent = "Copiar";
  botao.addEventListener("click", () => copiar(url, botao));

  topo.append(ancora, cliques, botao);

  // textContent, nunca innerHTML: a URL longa veio de quem digitou.
  const longa = document.createElement("p");
  longa.className = "item-url";
  longa.textContent = link.longUrl;
  longa.title = link.longUrl;

  item.append(topo, longa);
  return item;
}

async function carregar() {
  const botao = $("btn-atualizar");
  botao.disabled = true;
  try {
    const { links } = await pedir("/urls");
    $("lista").replaceChildren();
    if (links.length === 0) {
      const vazio = document.createElement("li");
      vazio.className = "vazio";
      vazio.textContent = "Nenhum link ainda.";
      $("lista").append(vazio);
    } else {
      $("lista").append(...links.map(criarItem));
    }
    limparErro();
  } catch (e) {
    erro(...mensagemDeFalha(e));
  } finally {
    botao.disabled = false;
  }
}

$("form").addEventListener("submit", async (evento) => {
  evento.preventDefault();
  const botao = $("btn-encurtar");
  limparErro();
  botao.disabled = true;
  botao.textContent = "Encurtando...";
  try {
    await pedir("/shorten", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value.trim() }),
    });
    $("url").value = "";
    await carregar();
  } catch (e) {
    erro(...mensagemDeFalha(e));
  } finally {
    botao.disabled = false;
    botao.textContent = "Encurtar";
  }
});

$("btn-atualizar").addEventListener("click", carregar);
carregar();
</script>
</body>
</html>
